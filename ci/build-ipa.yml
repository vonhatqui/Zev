name: Build Zev iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Zev iOS App
        run: |
          cd ios
          xcodebuild clean build \
            -project Zev.xcodeproj \
            -scheme Zev \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (Payload structure)
        run: |
          cd ios
          APP_PATH=$(find ./DerivedData -name "Zev.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Zev.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ../Zev.ipa Payload
          cd ..
          echo "✅ Created Zev.ipa successfully! Size: $(ls -lh Zev.ipa | awk '{print $5}')"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zev-iOS-IPA
          path: Zev.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Zev iOS Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: Zev.ipa
          draft: false
          prerelease: false
          body: |
            ## 🚀 Zev iOS Application (IPA)
            - **Phiên bản:** 1.0.0
            - **Hỗ trợ:** iOS 15.0+ (iPhone & iPad)
            - **Cách cài đặt:** Cài đặt qua TrollStore, Scarlet, Esign, AltStore hoặc Sideloadly.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
