name: Build Zev iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build Zev iOS App
        run: |
          cd ios
          xcodebuild clean build \
            -project Zev.xcodeproj \
            -scheme Zev \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (Payload structure)
        run: |
          cd ios
          APP_PATH=$(find ./DerivedData -name "Zev.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Zev.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          # Nhúng tài nguyên ảnh vào app bundle để load tức thì không cần mạng
          if [ -d "Zev/Resources/Images" ]; then
            cp -r Zev/Resources/Images/* "$APP_PATH/" 2>/dev/null || true
            mkdir -p "$APP_PATH/Images"
            cp -r Zev/Resources/Images/* "$APP_PATH/Images/" 2>/dev/null || true
          fi
          cp -r "$APP_PATH" Payload/
          zip -r ../Zev.ipa Payload
          cd ..
          echo "✅ Created Zev.ipa successfully! Size: $(ls -lh Zev.ipa | awk '{print $5}')"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zev-iOS-IPA
          path: Zev.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Zev iOS Release
          tag_name: v1.0.0
          files: Zev.ipa
          draft: false
          prerelease: false
          body: |
            ## 🚀 Zev iOS Application (IPA)
            - **Phiên bản:** 1.0.0
            - **Hỗ trợ:** iOS 15.0+ (iPhone & iPad)
            - **Cài đặt:** TrollStore, Scarlet, Esign, AltStore, Sideloadly.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
